spring:
  application:
    name: financial-tracker

server:
  port: 8080
  # Beanstalk's nginx forwards to 5000 by default; set SERVER_PORT there.

finance:
  # A new user's data starts from this file. `./gradlew bootRun` points it at
  # frontend/src/data/seed.local.json when that (gitignored) file exists.
  seed: classpath:seed/sample.json
  # memory (default; lost on restart) or dynamodb
  storage: memory
  dynamodb:
    table-name: financial-tracker
  auth:
    # none (default; everyone is the local user) or google
    mode: none

management:
  endpoints:
    web:
      exposure:
        include: health

---
# `--spring.profiles.active=local-dynamodb`: DynamoDB Local on port 8000 (see docs/deploy.md).
# Dummy credentials, so it never touches an AWS account; the table is created on startup.
spring.config.activate.on-profile: local-dynamodb
finance:
  storage: dynamodb
  dynamodb:
    endpoint: http://localhost:8000

---
# What runs on Elastic Beanstalk (SPRING_PROFILES_ACTIVE=aws). Everything secret or account-specific
# comes from environment variables set on the environment; see docs/deploy.md.
spring.config.activate.on-profile: aws
server:
  port: 5000
  # Behind Beanstalk's load balancer / nginx: trust X-Forwarded-* so redirects use https and the real host
  forward-headers-strategy: native
  servlet.session.cookie:
    secure: true
    same-site: lax
finance:
  storage: dynamodb
  dynamodb:
    table-name: ${FINANCE_TABLE_NAME:financial-tracker}
  auth:
    mode: google
    allowed-emails: ${ALLOWED_EMAILS}
spring.security.oauth2.client.registration.google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  scope: openid, profile, email
