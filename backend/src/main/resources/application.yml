spring:
  application:
    name: financial-tracker

server:
  port: 8080

finance:
  # A new user's data starts from this file. `./gradlew bootRun` points it at
  # frontend/src/data/seed.local.json when that (gitignored) file exists.
  seed: classpath:seed/sample.json
  # memory (default; lost on restart) or dynamodb
  storage: memory
  dynamodb:
    table-name: financial-tracker
  auth:
    # none (default; everyone is the local user) or google
    mode: none

management:
  endpoints:
    web:
      exposure:
        include: health

---
# `--spring.profiles.active=local-dynamodb`: DynamoDB Local on port 8000 (see docs/deploy.md).
# Dummy credentials, so it never touches an AWS account; the table is created on startup.
spring.config.activate.on-profile: local-dynamodb
finance:
  storage: dynamodb
  dynamodb:
    endpoint: http://localhost:8000

---
# What runs on AWS Lambda (SPRING_PROFILES_ACTIVE=aws). Everything secret or account-specific
# comes from the function's environment variables; see docs/deploy.md.
spring.config.activate.on-profile: aws
server:
  # CloudFront sends X-Forwarded-Host/-Proto (added by its viewer-request function), so redirects and
  # links use the public https address instead of the function URL's own host
  forward-headers-strategy: framework
finance:
  storage: dynamodb
  dynamodb:
    table-name: ${FINANCE_TABLE_NAME:financial-tracker}
  auth:
    mode: google
    allowed-emails: ${ALLOWED_EMAILS}
    # Lambda instances share nothing in memory
    session-store: dynamodb
spring.security.oauth2.client.registration.google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  scope: openid, profile, email
  # the public address, e.g. https://d1abc.cloudfront.net, so Google's redirect never depends on headers
  redirect-uri: ${PUBLIC_URL}/login/oauth2/code/{registrationId}
